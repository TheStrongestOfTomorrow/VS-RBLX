name: "🛡 VS-RBLX Community Extension Gatekeeper"

# Runs ONLY when an issue is opened, edited, or reopened.
# Comments (`issue_comment`) are intentionally not workflow triggers: reviews/discussion stay public, never release records.
on:
  issues:
    types: [opened, edited, reopened, closed]

permissions:
  contents: write
  issues: write

jobs:
  verify-extension-issue:
    name: "Validate Community Extension or Owner-Authorized Version"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository validator
        uses: actions/checkout@v4

      - name: Prevent accepted parent manifest edits from acting as releases
        id: parent-baseline
        if: github.event.action == 'edited' && contains(github.event.issue.labels.*.name, 'verified-template') && !contains(github.event.issue.labels.*.name, 'community-extension-version')
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const { validateIssue } = require("./.github/scripts/validate_extension_issue.js");
            const issue = context.payload.issue;
            const beforeBody = context.payload.changes && context.payload.changes.body && context.payload.changes.body.from;
            if (typeof beforeBody !== "string") return;
            const previous = validateIssue(issue.title || "", beforeBody);
            const current = validateIssue(issue.title || "", issue.body || "");
            const stable = (value) => JSON.stringify((function sort(v) {
              if (Array.isArray(v)) return v.map(sort);
              if (v && typeof v === "object") return Object.fromEntries(Object.keys(v).sort().map((key) => [key, sort(v[key])]));
              return v;
            })(value));
            if (previous.ok && previous.manifest && current.ok && current.manifest && stable(previous.manifest) !== stable(current.manifest)) {
              current.ok = false;
              current.manifest = null;
              current.findings.push("The accepted parent manifest is immutable; publish every release through the owner-authorized Version Update form.");
              fs.writeFileSync("/tmp/gatekeeper-result.json", JSON.stringify(current, null, 2), "utf8");
              core.setOutput("blocked", "true");
            }

      - name: Run deterministic extension submission scanner
        if: github.event.action != 'closed' && steps.parent-baseline.outputs.blocked != 'true' && !startsWith(github.event.issue.title, '[EXT-VERSION]') && !contains(github.event.issue.labels.*.name, 'community-extension-version')
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          GATEKEEPER_OUT: /tmp/gatekeeper-result.json
        run: node .github/scripts/validate_extension_issue.js

      - name: Validate parent-owner version issue and link it as a sub-issue
        if: github.event.action != 'closed' && (startsWith(github.event.issue.title, '[EXT-VERSION]') || contains(github.event.issue.labels.*.name, 'community-extension-version'))
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const { validateExtensionVersion, parseVersionIssueNumber, compareSemver } = require("./.github/scripts/validate_extension_version.js");
            const { validateIssue } = require("./.github/scripts/validate_extension_issue.js");
            const child = context.payload.issue;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            let report;
            try {
              const parentNumber = parseVersionIssueNumber(child.body);
              if (!parentNumber) throw new Error("Parent Extension Issue number is missing or invalid.");
              const parentRes = await github.rest.issues.get({ owner, repo, issue_number: parentNumber });
              const parent = parentRes.data;
              if (parent.pull_request) throw new Error("The parent reference is a pull request, not an extension issue.");
              const labels = (parent.labels || []).map((item) => typeof item === "string" ? item : item.name);
              if (!labels.includes("verified-template") || !labels.includes("community-extension")) {
                throw new Error("Parent must be an open, verified community extension issue.");
              }
              if (parent.state !== "open") throw new Error("Parent extension issue is closed.");

              report = validateExtensionVersion({
                title: child.title,
                body: child.body || "",
                author: child.user && child.user.login,
                parentNumber,
                parentAuthor: parent.user && parent.user.login,
                parentTitle: parent.title,
                parentBody: parent.body || "",
              });
              report.kind = "version";
              let alreadyLinked = false;
              if (report.ok) {
                const siblings = await github.paginate("GET /repos/{owner}/{repo}/issues/{issue_number}/sub_issues", {
                  owner, repo, issue_number: parentNumber, per_page: 100,
                });
                alreadyLinked = siblings.some((sibling) => sibling.number === child.number);
                let highest = validateIssue(parent.title || "", parent.body || "").manifest.version;
                for (const sibling of siblings) {
                  const siblingLabels = (sibling.labels || []).map((item) => typeof item === "string" ? item : item.name);
                  if (!siblingLabels.includes("community-extension-version") || !/^\[EXT-VERSION\]\s+/i.test(String(sibling.title || ""))) continue;
                  if (sibling.number === child.number || (sibling.user && parent.user && String(sibling.user.login || "").toLowerCase() !== String(parent.user.login || "").toLowerCase())) continue;
                  const siblingScan = validateIssue(sibling.title || "", sibling.body || "");
                  if (siblingScan.ok && siblingScan.manifest && siblingScan.manifest.id === report.manifest.id && siblingScan.manifest.template === report.manifest.template && compareSemver(siblingScan.manifest.version, highest) > 0) {
                    highest = siblingScan.manifest.version;
                  }
                }
                if (compareSemver(report.manifest.version, highest) <= 0) {
                  report.ok = false;
                  report.manifest = null;
                  report.findings.push(`Version must be greater than the highest owner-authorized linked version (${highest}).`);
                }
              }
              if (report.ok && !alreadyLinked) {
                await github.request("POST /repos/{owner}/{repo}/issues/{issue_number}/sub_issues", {
                  owner, repo, issue_number: parentNumber, sub_issue_id: child.id,
                });
              }
            } catch (error) {
              report = report || { ok: false, malicious: false, findings: [] };
              report.ok = false;
              report.manifest = null;
              report.findings = [...(report.findings || []), `Version authorization/link validation failed: ${error.message}`];
              report.kind = "version";
            }
            fs.writeFileSync("/tmp/gatekeeper-result.json", JSON.stringify(report, null, 2), "utf8");

      - name: Enforce Gatekeeper Verdict (Allow Verified or Auto-Close Invalid/Malicious)
        if: github.event.action != 'closed'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const report = JSON.parse(fs.readFileSync("/tmp/gatekeeper-result.json", "utf8"));
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issue_number = context.issue.number;

            if (report.ok && report.manifest) {
              const m = report.manifest;
              const isVersion = report.kind === "version";
              const successLabels = isVersion
                ? ["community-extension-version", "verified-template", `template:${m.template}`]
                : ["community-extension", "verified-template", `template:${m.template}`];
              for (const label of successLabels) {
                try {
                  await github.rest.issues.createLabel({
                    owner, repo, name: label, color: "0e8a16",
                    description: label === "verified-template" ? "Passed the declarative extension schema and security gate." : "Verified community extension workflow marker.",
                  });
                } catch (_e) { /* label already exists */ }
              }
              try {
                await github.rest.issues.addLabels({ owner, repo, issue_number, labels: successLabels });
              } catch (e) {
                console.log("Label note:", e.message);
              }

              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body: isVersion
                  ? [
                      "### 🛡 VS-RBLX Version Gatekeeper — `OWNER VERIFIED`",
                      "",
                      `- **Extension:** \`${m.name}\` (\`${m.id}\` v\`${m.version}\`)`,
                      `- **Template:** \`${m.template}\` *(validated declarative manifest)*`,
                      "- Parent-author check, increasing SemVer, schema, and malware scan passed.",
                      "- Linked to its parent extension as a version sub-issue. Comments remain ordinary discussion.",
                      "- Registry publication follows the repository workflow; installing updates remains user-initiated.",
                    ].join("\n")
                  : [
                      "### 🛡 VS-RBLX Security Gatekeeper — `VERIFIED CLEAN`",
                      "",
                      `- **Extension:** \`${m.name}\` (\`${m.id}\` v\`${m.version}\`)`,
                      `- **Template:** \`${m.template}\` *(strictly declarative — zero executable code)*`,
                      "- **Malware & Exfiltration Scan:** Passed (`0` findings)",
                      "",
                      "Players can now install this extension in-game via **VS-RBLX → Extensions (`Ctrl+Shift+X`) → ↻ Sync Community Extensions**, and community members are welcome to leave feedback in the comments below!",
                    ].join("\n"),
              });
            } else {
              const bullets = (report.findings || []).map((f) => `- ❌ ${f}`).join("\n");
              const auditLabels = ["extension-rejected", report.malicious ? "extension-malware-flagged" : "extension-review-needed"];
              for (const label of auditLabels) {
                try {
                  await github.rest.issues.createLabel({
                    owner, repo, name: label,
                    color: report.malicious ? "b60205" : "fbca04",
                    description: report.malicious ? "Automated extension scanner flagged malicious behavior." : "Extension validation failed; maintainer review may classify false positives, never bypassing validation.",
                  });
                } catch (_e) { /* label may already exist */ }
              }
              try { await github.rest.issues.addLabels({ owner, repo, issue_number, labels: auditLabels }); } catch (e) { console.log("Audit label note:", e.message); }
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body: [
                  "### ⛔ VS-RBLX Security Gatekeeper — Issue Automatically Closed",
                  "",
                  "GitHub Issues on **VS-RBLX** are strictly locked to the **5 Verified Declarative Community Extension Templates** (`theme-pack`, `snippet-pack`, `command-macro`, `keymap-preset`, `toolbar-tool`).",
                  "",
                  "**Reasons this issue was rejected and closed:**",
                  bullets || "- ❌ Did not match the required Community Extension YAML Form.",
                  "",
                  "> Tip: Inside VS-RBLX, open **Extensions (`Ctrl+Shift+X`) → 🛡 Scanner**, pick one of the 5 starter templates, verify `🛡 VERIFIED CLEAN`, and click **Copy Issue MD** before submitting.",
                ].join("\n"),
              });

              await github.rest.issues.update({
                owner,
                repo,
                issue_number,
                state: "closed",
                state_reason: "not_planned",
              });

              if (report.malicious) {
                try {
                  await github.rest.issues.lock({
                    owner,
                    repo,
                    issue_number,
                    lock_reason: "spam",
                  });
                } catch (e) {
                  console.log("Lock note:", e.message);
                }
              }
            }

      - name: Compile Static CDN Marketplace Pages (10/page + Owner-Verified Version Sub-Issue SemVer)
        uses: actions/github-script@v7
        with:
          script: |
            const path = require("path");
            const { resolveExtensionFamily, writeRegistryFiles } = require("./.github/scripts/build_extension_registry.js");
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const openIssues = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: "open",
              labels: "verified-template",
              per_page: 100,
            });

            const subIssueIds = new Set();
            const subMap = new Map();
            for (const iss of openIssues) {
              if (iss.pull_request) continue;
              try {
                const subs = await github.paginate("GET /repos/{owner}/{repo}/issues/{issue_number}/sub_issues", {
                  owner,
                  repo,
                  issue_number: iss.number,
                  per_page: 100,
                });
                subMap.set(iss.number, subs);
                for (const s of subs) subIssueIds.add(s.number);
              } catch (_err) {
                subMap.set(iss.number, []);
              }
            }

            const resolved = [];
            for (const iss of openIssues) {
              const issueLabels = (iss.labels || []).map((item) => typeof item === "string" ? item : item.name);
              const isVersionIssue = issueLabels.includes("community-extension-version") || /^\[EXT-VERSION\]\s+/i.test(String(iss.title || ""));
              if (iss.pull_request || subIssueIds.has(iss.number) || isVersionIssue) continue;
              const fam = resolveExtensionFamily(iss, subMap.get(iss.number) || []);
              if (fam.ok) resolved.push(fam);
            }

            if (resolved.length > 0) {
              writeRegistryFiles(path.resolve(process.cwd(), "registry"), resolved, `${owner}/${repo}`);
            }

      - name: Commit Updated Static CDN Registry Pages (if changed)
        run: |
          if [ -n "$(git status --porcelain registry/)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add registry/
            git commit -m "chore(registry): rebuild static 10-per-page extension CDN slices [skip ci]"
            git push origin HEAD:main || true
          fi

