name: "🧩 Submit Verified Community Extension (5 Allowed Templates Only)"
description: "Publish a purely declarative Theme, Snippet Pack, Command Macro, Keymap Preset, or Editor Quick-Tool to the VS-RBLX Extension Hub. Any off-topic, blank, or executable/malicious submission is automatically closed by the Security Gatekeeper."
title: "[EXT] "
labels: ["community-extension"]
body:
  - type: markdown
    attributes:
      value: |
        > [!WARNING]
        > **GitHub Issues on `VS-RBLX` are strictly locked to the 5 Verified Declarative Extension Templates.**
        > Every opened or edited issue is scanned automatically by **GitHub Actions** and again by the **in-client VS-RBLX Malware Scanner**.
        > - **Allowed Templates (`5` only):** `theme-pack`, `snippet-pack`, `command-macro`, `keymap-preset`, `toolbar-tool`
        > - **Strictly Forbidden:** `loadstring`, `HttpGet`, `request`, webhooks (`discord.com/api/webhooks`, Slack, Telegram), `getgenv`, `hookfunction`, `writefile`/`delfile`, obfuscators, escaped bytecode, or off-topic bug/chat posts.
        > - Non-conforming or malicious issues are **automatically closed** (`not_planned`), while comments on verified extension issues remain open for community feedback!

  - type: dropdown
    id: template
    attributes:
      label: "Extension Template"
      description: "Select the exact declarative template your manifest implements."
      options:
        - "theme-pack"
        - "snippet-pack"
        - "command-macro"
        - "keymap-preset"
        - "toolbar-tool"
    validations:
      required: true

  - type: input
    id: ext_id
    attributes:
      label: "Extension ID"
      description: "Unique lowercase kebab-case identifier (`^[a-z0-9][a-z0-9-_]+$`, max 48 chars). Must match `manifest.id`."
      placeholder: "solar-flare-theme"
    validations:
      required: true

  - type: input
    id: display_name
    attributes:
      label: "Display Name"
      description: "Human-readable extension title (3–64 characters). Must match `manifest.name`."
      placeholder: "Solar Flare Dark"
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: "Version"
      description: "Strict Semantic Version (`X.Y.Z`). Must match `manifest.version`."
      placeholder: "1.0.0"
      value: "1.0.0"
    validations:
      required: true

  - type: textarea
    id: summary
    attributes:
      label: "Summary"
      description: "Short plain-text description of what this declarative pack provides (no external links or webhooks)."
      placeholder: "Warm high-contrast amber & obsidian color theme for VS-RBLX."
    validations:
      required: true

  - type: textarea
    id: manifest_json
    attributes:
      label: "Manifest JSON"
      description: "Paste the pure JSON manifest generated via `Extensions -> 🛡 Scanner -> Copy Issue MD` inside VS-RBLX."
      render: json
      placeholder: |
        {
          "id": "solar-flare-theme",
          "name": "Solar Flare Dark",
          "version": "1.0.0",
          "author": "your-github-username",
          "summary": "Warm high-contrast amber & obsidian color theme.",
          "template": "theme-pack",
          "theme": {
            "isLight": false,
            "colors": {
              "editor": "#12100e",
              "sideBar": "#181512",
              "accent": "#ff9f1c",
              "statusBar": "#ff9f1c"
            },
            "syntax": {
              "keyword": "#ff9f1c",
              "string": "#2ec4b6",
              "number": "#ffbf69",
              "comment": "#6b6257"
            }
          }
        }
    validations:
      required: true

  - type: checkboxes
    id: attestations
    attributes:
      label: "Security Attestations"
      description: "All attestations are mandatory."
      options:
        - label: "This submission strictly uses one of the 5 declarative templates and contains zero executable Luau/bytecode."
          required: true
        - label: "This submission contains zero webhooks, outbound URLs, obfuscated strings, or credential reads."
          required: true
