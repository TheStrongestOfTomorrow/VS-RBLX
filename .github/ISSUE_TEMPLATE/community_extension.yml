name: "Submit Community Extension (5 Allowed Templates)"
description: "Submit a verified declarative Theme, Snippet Pack, Macro, Keymap, or Quick-Tool JSON manifest."
title: "[EXT] "
labels:
  - "community-extension"
body:
  - type: markdown
    attributes:
      value: |
        > [!WARNING]
        > **GitHub Issues on `VS-RBLX` are strictly locked to the 5 Verified Declarative Extension Templates.**
        > Every opened or edited issue is scanned automatically by **GitHub Actions** and again by the **in-client VS-RBLX Malware Scanner**.
        > - **Allowed Templates (`5` only):** `theme-pack`, `snippet-pack`, `command-macro`, `keymap-preset`, `toolbar-tool`
        > - **Strictly Forbidden:** `loadstring`, `HttpGet`, `request`, webhooks (`discord.com/api/webhooks`, Slack, Telegram), `getgenv`, `hookfunction`, `writefile`/`delfile`, obfuscators, escaped bytecode, or off-topic posts.
        > - Non-conforming or malicious issues are **automatically closed**, while comments on verified extension issues remain open!

  - type: dropdown
    id: ext_template
    attributes:
      label: "Extension Template"
      description: "Select the exact declarative template your manifest implements."
      options:
        - "theme-pack"
        - "snippet-pack"
        - "command-macro"
        - "keymap-preset"
        - "toolbar-tool"
    validations:
      required: true

  - type: input
    id: ext_id
    attributes:
      label: "Extension ID"
      description: "Unique lowercase kebab-case identifier (max 48 chars). Must match manifest.id."
      placeholder: "crimson-midnight-theme"
    validations:
      required: true

  - type: input
    id: display_name
    attributes:
      label: "Display Name"
      description: "Human-readable extension title (3-64 characters). Must match manifest.name."
      placeholder: "Crimson Midnight"
    validations:
      required: true

  - type: input
    id: ext_version
    attributes:
      label: "Version"
      description: "Strict Semantic Version (X.Y.Z). Must match manifest.version."
      placeholder: "1.0.0"
      value: "1.0.0"
    validations:
      required: true

  - type: textarea
    id: ext_summary
    attributes:
      label: "Summary"
      description: "Short plain-text description of what this declarative pack provides (no external links or webhooks)."
      placeholder: "Deep obsidian and crimson red dark theme for VS-RBLX."
    validations:
      required: true

  - type: textarea
    id: manifest_json
    attributes:
      label: "Manifest JSON"
      description: "Paste pure JSON only (do not wrap in backticks; GitHub wraps it automatically)."
      render: json
      placeholder: |
        {
          "id": "crimson-midnight-theme",
          "name": "Crimson Midnight",
          "version": "1.0.0",
          "author": "your-github-username",
          "summary": "Deep obsidian and crimson red dark theme for VS-RBLX.",
          "template": "theme-pack",
          "theme": {
            "isLight": false,
            "colors": {
              "editor": "#0f0609",
              "sideBar": "#16090e",
              "accent": "#fb7185",
              "statusBar": "#e11d48"
            },
            "syntax": {
              "keyword": "#fb7185",
              "string": "#4ade80",
              "number": "#c084fc",
              "comment": "#7f5563"
            }
          }
        }
    validations:
      required: true

  - type: checkboxes
    id: attestations
    attributes:
      label: "Security Attestations"
      description: "All attestations are mandatory."
      options:
        - label: "This submission strictly uses one of the 5 declarative templates and contains zero executable Luau/bytecode."
          required: true
        - label: "This submission contains zero webhooks, outbound URLs, obfuscated strings, or credential reads."
          required: true
