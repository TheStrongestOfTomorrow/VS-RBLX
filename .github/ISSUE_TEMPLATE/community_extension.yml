name: "Community Extension Submission"
description: "Submit a safe declarative VS-RBLX theme, snippet pack, macro, keymap, or toolbar tool."
title: "[EXT] "
labels:
  - "community-extension"
body:
  - type: markdown
    attributes:
      value: |
        ## Before you submit
        This repository accepts **five declarative formats only**: `theme-pack`, `snippet-pack`, `command-macro`, `keymap-preset`, and `toolbar-tool`. These formats are intentionally limited and cannot run arbitrary Luau.

        **Never include** executable scripts, bytecode, obfuscated payloads, outbound requests, credentials, executor APIs, or instructions to bypass Roblox/VS-RBLX security. Actions scan new and edited issues; unsafe or malformed submissions are closed. Comments on accepted issues remain open for normal discussion and reviews, but comments are never releases.

        Read [CONTRIBUTING_EXTENSIONS.md](https://github.com/TheStrongestOfTomorrow/VS-RBLX/blob/main/CONTRIBUTING_EXTENSIONS.md) for the full guide, compatibility notes, examples, review process, and troubleshooting. Submit only work you created or are licensed to share.

  - type: dropdown
    id: ext_template
    attributes:
      label: Declarative template type
      description: "Choose a format supported by both the VS-RBLX runtime and validator. Do not submit executable plugins."
      options:
        - "theme-pack"
        - "snippet-pack"
        - "command-macro"
        - "keymap-preset"
        - "toolbar-tool"
    validations:
      required: true

  - type: input
    id: ext_id
    attributes:
      label: Extension ID
      description: "Stable unique identifier, lowercase kebab-case, 2–48 characters; must equal manifest.id. Do not change it for later versions."
      placeholder: "aurora-midnight"
    validations:
      required: true

  - type: input
    id: display_name
    attributes:
      label: Display name
      description: "Human-readable title, 3–64 characters; must equal manifest.name."
      placeholder: "Aurora Midnight"
    validations:
      required: true

  - type: input
    id: ext_version
    attributes:
      label: Initial version
      description: "Use strict SemVer X.Y.Z (for example 1.0.0). Later releases use the separate owner-only Version Update form."
      placeholder: "1.0.0"
      value: "1.0.0"
    validations:
      required: true

  - type: input
    id: compatibility
    attributes:
      label: Tested VS-RBLX version/build (optional)
      description: "State the version/build and Roblox client/device tested, or write Not tested. Do not claim compatibility you have not checked."
      placeholder: "VS-RBLX 1.0.0 · Roblox desktop client · not yet tested"
    validations:
      required: false

  - type: textarea
    id: ext_summary
    attributes:
      label: What does it provide?
      description: "Plain-text summary of behavior, intended users, and any limitations. No external links, executable instructions, or webhooks."
      placeholder: "A low-contrast dark theme with warm syntax colors for long coding sessions."
    validations:
      required: true

  - type: textarea
    id: manifest_json
    attributes:
      label: Declarative manifest JSON
      description: "Paste valid JSON only. The template field and required data must match your selected format. Keep all strings concise; do not add keys the runtime does not support."
      render: json
      placeholder: |
        {
          "id": "aurora-midnight",
          "name": "Aurora Midnight",
          "version": "1.0.0",
          "author": "your-github-username",
          "summary": "A restrained dark theme for focused editing.",
          "template": "theme-pack",
          "theme": {
            "isLight": false,
            "colors": {
              "editor": "#10131c",
              "sideBar": "#151a26",
              "accent": "#7dd3c7",
              "statusBar": "#263544"
            },
            "syntax": {
              "keyword": "#c4a7e7",
              "string": "#a8d5a2",
              "number": "#f2c38f",
              "comment": "#778092"
            }
          }
        }
    validations:
      required: true

  - type: textarea
    id: preview
    attributes:
      label: Preview / review notes (optional)
      description: "Describe how reviewers can verify the result in the VS-RBLX extension preview. Do not paste scripts or private data."
      placeholder: "For a theme, compare the editor, sidebar, status bar, and syntax colors in both light/dark UI surfaces."
    validations:
      required: false

  - type: checkboxes
    id: attestations
    attributes:
      label: Required security and authorship attestations
      description: "Every box is required. False or misleading attestations may result in rejection."
      options:
        - label: "I selected one of the five supported declarative templates; this manifest contains no executable Luau, bytecode, or obfuscated payload."
          required: true
        - label: "This submission contains no outbound requests, credential access, executor APIs, filesystem operations, or security bypass instructions."
          required: true
        - label: "I created this work or have permission to distribute it, and I have included required attribution/license notices."
          required: true
        - label: "I understand that Actions and the in-client scanner validate submissions, and that ordinary issue comments are discussion—not version releases."
          required: true
